name: Build 2rich VST3 (Windows)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - '.github/workflows/**'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target AuroraSynth_VST3
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 2rich-Windows-VST3
          path: build/AuroraSynth_artefacts/Release/VST3/2rich.vst3
          if-no-files-found: error
